<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharosa Bus: route map</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:900px;margin:1.5em auto;padding:0 1em;color:#222}
 .nav{margin:.2em 0 .8em;font-size:.9em} .bar{display:flex;gap:.8em;flex-wrap:wrap;margin:.8em 0} select{padding:.4em;font-size:1em}
 svg{width:100%;height:520px;border:1px solid #ddd;border-radius:8px;background:#fafafa}
 .key span{display:inline-block;margin-right:1em;font-size:.9em} .dot{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:middle;margin-right:4px}
 #info{min-height:1.5em;margin:.5em 0;color:#444}
</style></head><body><main>
<h1>Route map</h1>
<div class="nav"><a href="index.html">Plan a trip</a> · <a href="routes.html">Route map</a> · <a href="operators.html">Operators</a></div>
<div class="bar"><label>Route <select id="r"></select></label><label>Day <select id="d"><option>weekday</option><option>weekend</option></select></label><label>Time <select id="b"></select></label></div>
<div class="key"><span><i class="dot" style="background:#1a7f37"></i>Seats likely</span><span><i class="dot" style="background:#8a5a00"></i>Standing room</span><span><i class="dot" style="background:#c62828"></i>Crowded</span><span><i class="dot" style="background:#9a9a9a"></i>Not enough tickets</span></div>
<div id="info">Hover a segment.</div>
<svg id="m" viewBox="0 0 800 520"></svg>
<p class="small" style="color:#666;font-size:.85em">Segments are the stretches between consecutive stops, drawn straight (no road geometry). Levels use assumed bus capacity and assumed ticket-share scaling.</p>
<script>
const COL=["#1a7f37","#8a5a00","#c62828"],TXT=["Seats likely","Standing room","Crowded"];let D;
fetch("data/route_profiles.json").then(r=>r.json()).then(d=>{D=d;const r=document.getElementById("r");Object.keys(d.routes).forEach(k=>r.add(new Option(k,k)));
 const b=document.getElementById("b");d.bands.forEach((n,i)=>b.add(new Option(n,i)));b.value=3;["r","d","b"].forEach(i=>document.getElementById(i).addEventListener("input",draw));draw();}).catch(e=>info.textContent="Could not load data/route_profiles.json ("+e+"). Serve this folder over http (make web); run make export if the data is missing.");
function draw(){
 const R=D.routes[r.value],pts=R.stops,P=R.profile[d.value+"|"+b.value],svg=document.getElementById("m");svg.innerHTML="";
 if(pts.length<2)return;
 const la=pts.map(p=>p[0]),lo=pts.map(p=>p[1]),mnla=Math.min(...la),mxla=Math.max(...la),mnlo=Math.min(...lo),mxlo=Math.max(...lo);
 const k=Math.min(740/Math.max(mxlo-mnlo,1e-4),460/Math.max(mxla-mnla,1e-4));
 const X=p=>30+(p[1]-mnlo)*k,Y=p=>490-(p[0]-mnla)*k;
 for(let i=0;i<pts.length-1;i++){
  const l=document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1",X(pts[i]));l.setAttribute("y1",Y(pts[i]));l.setAttribute("x2",X(pts[i+1]));l.setAttribute("y2",Y(pts[i+1]));
  const c=P.level[i];l.setAttribute("stroke",c<0?"#9a9a9a":COL[c]);l.setAttribute("stroke-width",c<0?3:6);l.setAttribute("stroke-linecap","round");
  l.addEventListener("mouseenter",()=>info.textContent=`${pts[i][2]} → ${pts[i+1][2]}: `+(c<0?"not enough tickets":`${TXT[c]} (about ${P.load[i]>100?"100+":P.load[i]} people, assumption-based)`));
  svg.appendChild(l);}
 [0,pts.length-1].forEach(i=>{const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",X(pts[i])+6);t.setAttribute("y",Y(pts[i])-6);t.setAttribute("font-size","11");t.textContent=pts[i][2].slice(0,28);svg.appendChild(t);});
}
</script></main></body></html>
