<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bharosa Bus</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="app.css"></head>
<body>
<div class="app">
<main class="panel">
 <div class="phead">
  <div class="brand"><h1><span class="logo">BB</span>Bharosa Bus</h1>
   <select id="lang" aria-label="Label language"><option value="en">English</option><option value="hi">हिन्दी</option></select></div>
  <div class="nav"><a href="routes.html">Route map</a> · <a href="operators.html">Operators</a> · <a href="https://github.com/TavishAgarwal/Bharosa-Bus">Method</a></div>
  <p class="sub">How full each bus usually is, next to how long it takes. Grey means we don't have enough tickets to say.</p>
  <div id="live" hidden>
   <div class="row"><input id="cf" list="stops" placeholder="From stop" aria-label="From stop"><input id="ct" list="stops" placeholder="To stop" aria-label="To stop"></div>
   <div class="row"><input id="ctime" type="time" value="18:00" aria-label="Leaving at"><select id="cday" aria-label="Day type"><option>weekday</option><option>weekend</option></select><button class="go" id="cgo">Plan</button></div>
   <datalist id="stops"></datalist>
  </div>
  <div class="row"><select id="trip" aria-label="Example trip"></select><select id="time" aria-label="Example time" style="flex:.6"></select></div>
  <div class="tabs" role="group" aria-label="Rank by">
   <button data-w="0" aria-pressed="true">Fastest</button><button data-w="0.5" aria-pressed="false">Balanced</button><button data-w="1" aria-pressed="false">Most comfortable</button>
  </div>
 </div>
 <div class="list" id="out" aria-live="polite"></div>
 <details class="note"><summary>How to read this</summary><div id="assume"></div></details>
</main>
<section class="mapwrap" aria-label="Map of the selected journey">
 <div id="map"></div>
 <div class="legend" id="legend"></div>
 <div class="maptools"><a href="routes.html">Route map</a><a href="operators.html">Operators</a></div>
 <div class="summary" id="summary" hidden></div>
</section>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const LEVEL_EN={seats:"Seats likely",standing:"Standing room",crowded:"Crowded",unknown:"Not enough data"};
const LEVEL_HI={seats:"सीट मिलेगी",standing:"खड़े होने की जगह",crowded:"भीड़",unknown:"पक्का नहीं"};
const COLOR={seats:"#1a7f37",standing:"#b7791f",crowded:"#c62828",unknown:"#9e9e9e"};
const RANK={seats:0,standing:1,crowded:2};
let LT=LEVEL_EN, DATA=null, CUSTOM=null, W=0, SEL=0, MAP=null, LAYER=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hi=()=>LT===LEVEL_HI;

function initMap(){
 if(typeof L==="undefined"){$("map").innerHTML='<div class="nomap">Map needs an internet connection (map library and tiles). The journey list still works.</div>';return;}
 MAP=L.map("map",{zoomControl:false,attributionControl:true}).setView([28.62,77.21],11);
 L.control.zoom({position:"bottomright"}).addTo(MAP);
 L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(MAP);
 LAYER=L.layerGroup().addTo(MAP);
}
function legend(){$("legend").innerHTML=["seats","standing","crowded","unknown"].map(k=>`<span><i style="background:${k==="unknown"?"repeating-linear-gradient(90deg,#555 0 6px,transparent 6px 10px)":COLOR[k]}"></i>${LT[k]}</span>`).join("")+`<span><i style="background:repeating-linear-gradient(90deg,#161616 0 3px,transparent 3px 6px)"></i>${hi()?"पैदल":"Walk"}</span>`;}

fetch("data/demo_journeys.json").then(r=>r.json()).then(d=>{DATA=d;init();}).catch(e=>{$("out").textContent="Could not load data/demo_journeys.json ("+e+"). Serve this folder over http (make serve or make web) instead of opening the file directly.";});

function init(){
 initMap(); legend();
 const pairs=[...new Set(DATA.queries.map(q=>q.from+" → "+q.to))]; pairs.forEach(t=>$("trip").add(new Option(t,t)));
 [...new Set(DATA.queries.map(q=>q.day_type+" "+q.depart))].forEach(t=>$("time").add(new Option(t,t)));
 ["trip","time"].forEach(id=>$(id).addEventListener("input",()=>{CUSTOM=null;SEL=0;render();}));
 document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));W=parseFloat(b.dataset.w);SEL=0;render();}));
 $("lang").addEventListener("input",e=>{LT=e.target.value==="hi"?LEVEL_HI:LEVEL_EN;legend();render();});
 fetch("api/health").then(r=>r.ok?r.json():null).then(h=>{if(!h)return;$("live").hidden=false;
  fetch("api/stops").then(r=>r.json()).then(n=>{const dl=$("stops");n.forEach(x=>dl.appendChild(new Option(x)));});
  $("cgo").addEventListener("click",()=>{const f=$("cf").value.trim(),t=$("ct").value.trim();if(!f||!t)return;$("out").textContent="Planning…";
   fetch(`api/plan?from=${encodeURIComponent(f)}&to=${encodeURIComponent(t)}&time=${encodeURIComponent($("ctime").value||"18:00")}&day=${encodeURIComponent($("cday").value)}`)
    .then(r=>r.json()).then(q=>{CUSTOM=q.error?{options:[],error:q.error}:q;SEL=0;render();});});}).catch(()=>{});
 const a=DATA.assumptions;
 $("assume").innerHTML="Times are scheduled, not live. Crowding comes from about 2.5M October 2026 e-tickets (a small share of rides), scaled up with assumed ranges (ticket share "+esc(a.sample_rate.join("–"))+
  ", pass-holder uplift "+esc(a.pass_holder_uplift.join("–"))+"). \"Crowded\" means over the bus's rated seats + standing; bus capacity "+esc(a.capacity_source)+". A level needs at least "+esc(a.min_tickets_per_cell)+" tickets.";
 render();
}

function current(){
 if(CUSTOM)return CUSTOM;
 const [from,to]=$("trip").value.split(" → "),[dt,dep]=$("time").value.split(" ");
 return DATA.queries.find(q=>q.from===from&&q.to===to&&q.depart===dep&&q.day_type===dt);
}
// Fastest: earliest arrival (fewer changes breaks ties). Balanced / comfortable: minutes + 4 per change + crowding penalty.
function ranked(q){return q.options.map(o=>({...o,score:W===0?o.minutes_from_request+0.01*o.transfers:o.minutes_from_request+4*o.transfers+2*W*o.crowd_penalty_min})).sort((a,b)=>a.score-b.score).slice(0,5);}
function stretchKnown(o){const st=stretches(o).filter(x=>x.level!=="walk"),t=st.reduce((s,x)=>s+x.min,0);return t?st.filter(x=>x.level!=="unknown").reduce((s,x)=>s+x.min,0)/t:0;}
function stretches(o){ // [{level, minutes}] across the whole trip, walks included
 const out=[];o.legs.forEach(l=>{if(l.type==="walk"){if(l.minutes>=0.5)out.push({level:"walk",min:l.minutes});return;}
  const n=Math.max(l.seg_levels?l.seg_levels.length:1,1);(l.seg_levels||[l.crowding]).forEach(s=>out.push({level:s,min:l.minutes/n}));});return out;}
function tagOf(o,fastest){
 if(o===fastest)return hi()?"सबसे तेज़":"Fastest";
 if(o.worst_crowding==="unknown"||fastest.worst_crowding==="unknown")return "";
 if(RANK[o.worst_crowding]>=RANK[fastest.worst_crowding])return "";
 const dm=Math.round(o.minutes_from_request-fastest.minutes_from_request);
 return `${dm>0?"+"+dm+" min":"Same time"}, less crowded than the fastest`;
}
const cap=v=>v>100?"100+":v;
function busTxt(e){return e&&e.bus?` Bus: ${e.bus==="9m"?"9 m DEVI (inferred from a short D-route)":"12 m"}, ${e.seats} seats + ${e.rated_standing} standing.`:"";}
function why(o){
 const rows=o.legs.filter(l=>l.type==="ride").map(l=>{const e=l.evidence;
  if(!e)return `<p><b>${esc(l.route)}</b>: not enough tickets to estimate (${Math.round(l.evidence_coverage*100)}% of stretches covered, need 50%).</p>`;
  if(e.grain==="route typical")return `<p><b>${esc(l.route)}</b>: too few stretches on this ride have data, so this is the route's typical level at this time of day (busier-quarter stretch about ${cap(e.load)} people; ${e.stretches_with_data} stretches, ${e.tickets} tickets).${busTxt(e)}</p>`;
  return `<p><b>${esc(l.route)}</b>: busiest stretch ${esc(e.stretch)}. About ${cap(e.load)} people on board (range ${cap(e.low)}–${cap(e.high)}), from ${e.tickets} tickets over ${e.days} days${e.grain==="hour"?"":" (pooled across the day part)"}.${busTxt(e)}</p>`;}).join("");
 return `<details><summary>Why this estimate?</summary>${rows}<p>The range mixes day-to-day variation with the assumed ticket share and pass-holder uplift.</p></details>`;
}

function render(){
 const q=current(),out=$("out");out.innerHTML="";
 if(q&&q.from_resolved){const r=document.createElement("div");r.className="resolved";r.textContent=`Searched stops: ${q.from_resolved} → ${q.to_resolved}`;out.appendChild(r);}
 if(!q||!q.options.length){out.insertAdjacentHTML("beforeend",`<p>${q&&q.error?esc(q.error):"No bus journey found for this trip and time."}</p>`);$("summary").hidden=true;if(LAYER)LAYER.clearLayers();return;}
 const opts=ranked(q),fastest=opts.reduce((a,b)=>a.minutes_from_request<=b.minutes_from_request?a:b);
 SEL=Math.min(SEL,opts.length-1);
 opts.forEach((o,i)=>{
  const c=document.createElement("div");c.className="card"+(i===SEL?" sel":"");c.tabIndex=0;
  const t=tagOf(o,fastest),route=o.routes.join(" → ");
  let h=`<div class="ctop"><div><div class="ctitle">${esc(o.leave_origin)} → ${esc(o.arrive)}</div><div class="cmeta">${esc(route)} · ${Math.round(o.minutes_from_request)} min · ${o.transfers} change${o.transfers===1?"":"s"}</div></div>
   <span class="badge b-${o.worst_crowding}">${esc(LT[o.worst_crowding])}</span></div>${t?`<div class="tag">${esc(t)}</div>`:""}`;
  if(i===SEL){
   const st=stretches(o),tot=st.reduce((s,x)=>s+x.min,0)||1;
   h+=`<div class="bar" title="Crowding along the trip, stretch by stretch">${st.map(s=>`<span style="flex:${(s.min/tot).toFixed(4)};background:${s.level==="walk"?"#d9d9d6":COLOR[s.level]}"></span>`).join("")}</div>
    <div class="barkey"><span>${esc(q.from_resolved||o.from)}</span><span>${esc(q.to_resolved||o.to)}</span></div>
    <div class="grid"><div>Leave<b>${esc(o.leave_origin)}</b></div><div>Arrive<b>${esc(o.arrive)}</b></div><div>Door to door<b>${Math.round(o.door_to_door_min)} min</b></div><div>Ride with data<b>${Math.round(stretchKnown(o)*100)}%</b></div></div>
    <ul class="legs">${o.legs.map(l=>l.type==="walk"?(l.minutes>=0.5?`<li><span class="dot" style="background:#d9d9d6"></span><span class="m">Walk ${Math.round(l.minutes)} min</span></li>`:"")
     :`<li><span class="dot" style="background:${COLOR[l.crowding]}"></span><span><b>${esc(l.route)}</b> ${esc(l.board_time)} ${esc(l.board)} → ${esc(l.alight_time)} ${esc(l.alight)}<br><span class="m">${Math.round(l.minutes)} min · ${esc(LT[l.crowding])}${l.basis==="route"?(hi()?" (रूट औसत)":" (route average)"):""}</span></span></li>`).join("")}</ul>${why(o)}`;
  }
  c.innerHTML=h;
  if(i!==SEL){const pick=()=>{SEL=i;render();};c.addEventListener("click",pick);c.addEventListener("keydown",e=>{if(e.key==="Enter")pick();});}
  out.appendChild(c);
 });
 draw(opts[SEL],q,fastest);
}

function draw(o,q,fastest){
 const s=$("summary");s.hidden=false;
 const worstLeg=o.legs.filter(l=>l.type==="ride"&&l.evidence&&l.evidence.stretch).sort((a,b)=>(b.peak_load||0)-(a.peak_load||0))[0];
 s.innerHTML=`<div class="shead"><b>${esc(o.routes.join(" → "))}</b><span class="badge b-${o.worst_crowding}">${esc(LT[o.worst_crowding])}</span></div>
  <div class="scols"><div>From<b>${esc(q.from_resolved||o.from)}</b></div><div>To<b>${esc(q.to_resolved||o.to)}</b></div>
  <div>Leave → arrive<b>${esc(o.leave_origin)} → ${esc(o.arrive)}</b></div><div>Time<b>${Math.round(o.minutes_from_request)} min</b></div>
  <div>Vs fastest<b>${o===fastest?"Fastest":"+"+Math.max(0,Math.round(o.minutes_from_request-fastest.minutes_from_request))+" min"}</b></div>
  <div>Busiest stretch<b>${worstLeg?esc(worstLeg.evidence.stretch.split(" to ")[0]):"—"}</b></div></div>`;
 if(!MAP)return;
 LAYER.clearLayers();
 const pts=[];let prev=o.origin;
 o.legs.forEach((l,k)=>{
  if(l.type==="ride"){
   const p=l.path||[];
   if(prev&&p[0])L.polyline([prev,p[0]],{color:"#161616",weight:3,dashArray:"2 7",lineCap:"round"}).addTo(LAYER);
   for(let i=0;i+1<p.length;i++){if(!p[i]||!p[i+1])continue;const lv=(l.seg_levels||[])[i]||l.crowding;
    const nd=lv==="unknown"; // no data: darker dashed line so it stays visible on the grey basemap
    L.polyline([p[i],p[i+1]],{color:nd?"#555":COLOR[lv],weight:nd?5:6,opacity:.95,dashArray:nd?"8 6":null,lineCap:nd?"butt":"round"}).bindTooltip(`${esc(l.route)} · ${esc(LT[lv])}`).addTo(LAYER);}
   p.forEach((x,i)=>{if(x){pts.push(x);if(i===0||i===p.length-1)L.circleMarker(x,{radius:5,color:"#161616",weight:2,fillColor:"#fff",fillOpacity:1}).bindTooltip(esc(i===0?l.board:l.alight)).addTo(LAYER);}});
   prev=p[p.length-1]||prev;
  }
 });
 if(prev&&o.dest)L.polyline([prev,o.dest],{color:"#161616",weight:3,dashArray:"2 7",lineCap:"round"}).addTo(LAYER);
 [[o.origin,q.from_resolved||o.from],[o.dest,q.to_resolved||o.to]].forEach(([ll,name])=>{if(!ll)return;pts.push(ll);
  L.marker(ll,{icon:L.divIcon({className:"",html:`<span class="pin">${esc(name.split(" (")[0])}</span>`,iconSize:null,iconAnchor:[0,28]})}).addTo(LAYER);
  L.circleMarker(ll,{radius:6,color:"#fff",weight:2,fillColor:"#161616",fillOpacity:1}).addTo(LAYER);});
 if(pts.length){const wide=window.innerWidth>860;MAP.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[40,70],paddingBottomRight:[40,wide?170:40]});}
}
</script>
</body></html>
